# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        description: "Automatically run 'uv lock' on your project dependencies"
        entry: uv lock
        language: python
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        args: []
        pass_filenames: false
        additional_dependencies: []
      - id: uv-export
        name: uv-export
        description: "Automatically run 'uv export' on your project dependencies"
        entry: python -m scripts.gens
        language: python
        files: ^(uv\.lock)$
        args: []
        additional_dependencies: []
      - id: isort # 排序导入
        name: isort
        stages: [commit]
        language: python
        entry: uv run isort app
        types: [python]
      - id: mypy # 类型检查
        name: mypy
        stages: [commit]
        language: python
        entry: uv run mypy
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        description: "Run 'ruff check' for extremely fast Python linting"
        entry: uv run ruff check --force-exclude --fix
        language: python
        types_or: [python, pyi, jupyter]
        args: []
        require_serial: true
        additional_dependencies: []
      - id: ruff-format
        name: ruff format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: uv run ruff format --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        args: []
        require_serial: true
        additional_dependencies: []
      - id: pytest # 测试
        name: pytest
        stages: [commit]
        language: python
        entry: uv run pytest
        types: [python]
      - id: pytest-cov # 测试覆盖率
        name: pytest
        stages: [push]
        language: python
        entry: uv run pytest --cov --cov-fail-under=100
        types: [python]
        pass_filenames: false
      


ci:
  autofix_commit_msg: 🎨 [pre-commit.ci] Auto format from pre-commit.com hooks
  autoupdate_commit_msg: ⬆ [pre-commit.ci] pre-commit autoupdate
