[project]
name = "{{cookiiecutter.application_name}}"
version = "{{cookiiecutter.version}}"
description = "{{cookiiecutter.application_short_description}}"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "fastapi[standard]>=0.116.1",
    "psycopg[binary]>=3.1.0,<3.3.0",
    "pydantic-settings>=2.10.1",
    "uvicorn>=0.37.0",
    "loguru>=0.7.3",
    "redis==7.1.0",
    "sqlalchemy==2.0",
    "requests==2.28.1",
    {{ {% if cookiecutter.use_adk == "yes" %}
    "google-adk==1.20.0",
    "litellm==1.80.8",
    "ag-ui-adk==0.4.0",
    {% endif %}
]
authors = [
    {name = "{{cookiiecutter.author}}", email = "{{cookiiecutter.email}}"},
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
]
compile-bytecode = true


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.pip]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
